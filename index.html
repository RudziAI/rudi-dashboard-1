<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta http-equiv="Cache-Control" content="no-store">

<title>Rudi - at a glance</title>
<style>
:root{--bg:#042f33;--card:#0a4348;--card2:#0d5359;--line:#1b6b72;--text:#f4fbfa;--dim:#a9d3d0;--gold:#f5c451;--warn:#ff9aa8;--ok:#7be0b0}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(15px,1.12vw,30px)}
html{background:#042f33}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:.4rem 1rem .5rem;min-height:100vh;overflow-x:hidden}
header.top{display:flex;justify-content:center;align-items:center;height:1.5rem;margin-bottom:.3rem}
h1{font-size:1.5rem;font-weight:800;letter-spacing:.06em;color:var(--gold)}
#clock{font-size:2.7rem;font-weight:800;line-height:1}
#date{font-size:1.15rem;color:var(--dim);text-align:right}
.lock{background:none;border:1px solid var(--line);color:var(--dim);border-radius:.5rem;font-size:.7rem;padding:.1rem .8rem;cursor:pointer;opacity:.75}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;margin-bottom:.4rem}
.day{background:var(--card);border:1px solid var(--line);border-radius:.7rem;padding:.5rem .55rem;min-height:5rem;overflow:hidden}
.day.today{border:2px solid var(--gold);background:var(--card2)}
.day h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:.3rem}
.day.today h3{color:var(--gold)}
.day h3 b{font-size:1.45rem;color:var(--text);margin:0 .2rem}
.ev{font-size:.88rem;line-height:1.15;margin:.22rem 0;padding-left:.45rem;border-left:.28rem solid var(--k);overflow-wrap:anywhere;font-weight:600}
.ev i{font-style:normal;color:var(--gold);font-weight:800;margin-right:.25rem}
.ev.t{font-style:italic;opacity:.9}
.more{font-size:.75rem;color:var(--dim)}
.legend{display:none;gap:.2rem .9rem;flex-wrap:wrap;font-size:.72rem;color:var(--dim);margin-bottom:.35rem;padding:0 .2rem}
.legend span::before{content:"";display:inline-block;width:.7rem;height:.7rem;border-radius:.2rem;background:var(--k);margin-right:.3rem;vertical-align:-.05rem}
.later{display:flex;gap:.25rem 1.2rem;flex-wrap:wrap;font-size:.95rem;margin-bottom:.45rem;padding:.3rem .6rem;background:var(--card);border-radius:.6rem;border-left:.3rem solid var(--gold)}
.later>span:first-child{color:var(--gold);font-weight:800}
.later b{color:var(--gold)} .later em{font-style:normal;border-bottom:.18rem solid var(--k)}
.mainrow{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem}.mainrow>.grid{min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.blk{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent;background:var(--card);border:1px solid var(--line);border-top:.4rem solid var(--gold);border-radius:.8rem;padding:.7rem .9rem;display:flex;flex-direction:column}
.blk header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem}
.blk h2{font-size:1.25rem;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.upd{font-size:.68rem;color:var(--dim);text-align:right}
.upd.stale{color:var(--gold);font-weight:800}
.hero{font-size:2.7rem;font-weight:800;line-height:1.05;margin:.1rem 0 0}
.herosub{font-size:.9rem;color:var(--dim);margin-bottom:.4rem}
.row{padding:.35rem 0;border-top:1px solid var(--line);font-size:1rem;line-height:1.2}
.row:first-of-type{border-top:0}
.row .t{font-weight:800}
.row .d{color:var(--dim);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.bigrow{margin-bottom:.5rem}.bigrow .hero{font-size:2rem}.blk.quiet{border-top-color:var(--line)}
.row .s{font-size:.8rem;font-weight:800;margin-left:.35rem;color:var(--ok)}
.row.bad .s,.row.bad .t{color:var(--warn)}
.row.amb .s{color:var(--gold)}
.ph{margin-top:auto;padding-top:.3rem;font-size:.75rem;color:var(--dim)}
.foot{margin-top:.5rem;font-size:.68rem;color:var(--dim);text-align:center}
#gate{position:fixed;inset:0;background:#042f33;opacity:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;z-index:2147483647;text-align:center;padding:2rem;transition:none;animation:none;backdrop-filter:none;-webkit-backdrop-filter:none;isolation:isolate}
#gate h1{font-size:2.6rem}
#gate p{color:var(--dim);font-size:1.2rem;max-width:34rem}
#gate button{background:var(--gold);color:#042f33;border:0;border-radius:.8rem;font-size:1.6rem;font-weight:800;padding:.9rem 2.2rem;cursor:pointer}
#pad{display:grid;grid-template-columns:repeat(3,5.2rem);gap:.7rem}#pad button{background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:1rem;font-size:1.9rem;font-weight:800;padding:0;height:4.4rem;cursor:pointer;touch-action:manipulation}#pad button:active{background:var(--card2);border-color:var(--gold)}#pad button.go{background:var(--gold);color:#042f33;border-color:var(--gold)}#pad button.alt{color:var(--dim)}#gate input{letter-spacing:.5rem;background:var(--card);color:var(--text);border:2px solid var(--gold);border-radius:.8rem;font-size:1.6rem;padding:.8rem 1.2rem;width:min(26rem,86vw);text-align:center}#gate input:focus{outline:none;box-shadow:0 0 0 .25rem rgba(245,196,81,.35)}#gate .err{color:var(--warn);font-size:1rem;min-height:1.3rem}
.banner{background:var(--gold);color:#042f33;font-weight:800;text-align:center;font-size:.8rem;padding:.15rem;border-radius:.4rem;margin-bottom:.4rem}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.1rem 0;border-top:1px solid var(--line)}
.vrow .vn{font-weight:800;font-size:.85rem;line-height:1.1;min-width:0}.vrow .vn small{display:inline;margin-left:.4rem;color:var(--dim);font-weight:600;font-size:.78rem}.vrow .vn small.late{color:#ff6b6b;font-weight:800}
.vcs{display:flex;gap:.28rem;flex:none}.vc{width:1.25rem;height:1.25rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;border:1.5px solid var(--line);color:var(--dim)}.vc.on{background:#2fbf71;border-color:#2fbf71;color:#04210f}
.vkey{color:var(--dim);font-size:.72rem;margin:.1rem 0 .25rem}
.todo{border-top-color:#ff7a59}.todo h2{color:#ff9d80}.todo .upd b{color:var(--text);font-size:.85rem}
.todo .tdl{column-width:15rem;column-gap:1.2rem}
.td{display:flex;gap:.55rem;align-items:flex-start;padding:.4rem 0;border-top:1px solid var(--line);cursor:pointer;break-inside:avoid;font-size:.9rem;line-height:1.2;font-weight:700;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.td:first-child{border-top:0}
.td input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}
.td .cb{flex:none;width:1.15rem;height:1.15rem;border:2px solid var(--dim);border-radius:.3rem;margin-top:.02rem;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.td input:checked+.cb{background:#2fbf71;border-color:#2fbf71}
.td input:checked+.cb::after{content:"";width:.3rem;height:.58rem;border:solid #04210f;border-width:0 .17rem .17rem 0;transform:rotate(45deg) translate(-.06rem,-.06rem)}
.td input:focus-visible+.cb{outline:2px solid var(--gold);outline-offset:2px}
.td .tx{min-width:0;overflow-wrap:anywhere;transition:opacity .2s}
.td.on .tx{text-decoration:line-through;opacity:.42}
@media (pointer:coarse){.td{padding:.7rem 0}.td .cb{width:1.6rem;height:1.6rem}.td .cb::after{transform:rotate(45deg) translate(-.08rem,-.08rem)}.td .tx{font-size:1.02rem;padding-top:.12rem}}
.td .tx small{display:block;font-weight:500;font-size:.72rem;color:var(--dim);margin-top:.08rem}
.td .tx small.od{color:var(--warn);font-weight:800}
@media (min-width:1100px){body{height:100vh;display:flex;flex-direction:column;overflow:hidden}.mainrow{flex:1;min-height:0;grid-template-columns:clamp(11.5rem,15vw,18rem) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}.grid{min-height:0;grid-template-rows:1.25fr 1fr}.blk{min-height:0;overflow-y:auto;overflow-x:hidden}.todo .tdl{columns:1}}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.strip{grid-template-columns:repeat(4,1fr)}}
@media (max-width:700px){.grid{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,1fr)}.todo .tdl{columns:1}.todo{max-height:19rem}}
#fs{display:none}</style>
</head>

function finPost(t){const rows=(RAW.Finances||[]).slice(3);const today=new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());const mo=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];const days=[];rows.forEach(r=>{const m=g(r,0).trim().match(/^[A-Za-z]{3}\s+(\d{1,2})\s+([A-Za-z]{3})$/);if(!m)return;const mi=mo.indexOf(m[2].toLowerCase());if(mi<0)return;let d=new Date(today.getFullYear(),mi,+m[1]);if(d<new Date(today.getFullYear(),today.getMonth()-6,1))d=new Date(today.getFullYear()+1,mi,+m[1]);if(d<today)return;const out=g(r,1).split("\n");days.push({d,day:g(r,0).trim(),amt:out[0].trim(),lab:(out[1]||"").trim(),left:g(r,2).trim()});});if(!days.length)return "";const nx=days;let h='';nx.forEach(x=>{const neg=/^-|\u2212/.test(x.left);h+='<div class="vrow"><div class="vn">'+esc(x.day)+(x.amt?'<small>'+esc(x.amt)+(x.lab?" \u00b7 "+esc(x.lab.length>24?x.lab.slice(0,22)+"\u2026":x.lab):"")+'</small>':'')+'</div><div class="vcs"><b'+(neg?' style="color:#ff6b6b"':'')+'>'+esc(x.left)+'</b></div></div>';});return h;}

 {tab:"Books & Etsy",title:"",notitle:true,hero:null,rows:t=>t.items.filter(i=>!isPH(i)).map(i=>({i,p:pd(i.date)})).filter(x=>!x.p||x.p.d>=new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())).sort((a,b)=>(a.p?a.p.d:0)-(b.p?b.p.d:0)).map(x=>({t:x.i.item,d:x.p?fmtD(x.p.d)+(x.p.t?" "+hm(x.p.d):""):""}))},

function tdate(s){const m=String(s).match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*(?:\s+(\d{1,2}):(\d\d))?/);if(!m)return null;const mo=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(m[2].toLowerCase());if(mo<0)return null;const n=new Date();let y=n.getFullYear();let d=new Date(y,mo,+m[1],+(m[3]||0),+(m[4]||0));if(n-d>1.6e10)d=new Date(y+1,mo,+m[1],+(m[3]||0),+(m[4]||0));return d;}
function ago(s){const p=pd(s); if(!p) return null; return (Date.now()-p.d.getTime())/36e5;}
// ---- To-do column -------------------------------------------------------------------------
// Items come from the 'To-do' tab (managed by Chief of Staff; cols Item, Status, Date, Detail, Updated).
// Daily rule (Europe/London): a ticked item stays shown, ticked, for the rest of the day it was ticked,
// and is hidden from the next day. Unticked items carry over. Ticks are written back to the sheet
// (Status=done/open + Updated=now) via the Apps Script feed (?a=todo) so they sync across devices;
// a dated local copy (localStorage, kept 14 days) covers offline / before the sheet re-reads.
const TD_KEY="rudi_td2"; let TD_MEM=null;
function tdToday(){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}catch(e){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}}
function tdHash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function tdLoad(){let o=TD_MEM;try{o=JSON.parse(localStorage.getItem(TD_KEY)||"null")||o;}catch(e){}o=o||{};const cut=new Date(Date.now()-14*864e5).toISOString().slice(0,10);Object.keys(o).forEach(k=>{if(!o[k]||!o[k].d||o[k].d<cut)delete o[k];});return o;}
function tdSave(o){TD_MEM=o;try{localStorage.setItem(TD_KEY,JSON.stringify(o));}catch(e){}}
function tdList(){
 const tk=tdToday(), loc=tdLoad(), out=[];
 ((T["To-do"]||parseTab("To-do")).items).forEach((i,n)=>{
  const text=i.item.trim(); if(!text||isPH(i)) return;
  const dm=String(i.date||"").trim().match(/^(\d{4}-\d\d-\d\d)/), dk=dm?dm[1]:"";
  const um=String(i.updated||"").trim().match(/^(\d{4}-\d\d-\d\d)/), uk=um?um[1]:"";
  if(dk&&dk>tk) return;                                   // future-dated: not today yet
  const id=tdHash(text.toLowerCase()+"|"+dk), L=loc[id];
  let on=/^done/i.test(i.status.trim()), day=on?(uk||dk||tk):"";
  if(L&&L.d>=(uk||"")){ on=!!L.v; day=L.v?L.d:""; }      // newer local tick/untick wins over the sheet
  if(on&&day<tk) return;                                  // ticked on an earlier day: gone
  let over=""; if(!on&&dk&&dk<tk){const p=pd(dk); over=p?fmtD(p.d):dk;}
  out.push({id,text,date:dk,detail:i.detail.trim(),on,over,dk,n});
 });
 out.sort((a,b)=>(a.on-b.on)||((b.over?1:0)-(a.over?1:0))||((a.over&&b.over)?(a.dk<b.dk?-1:a.dk>b.dk?1:0):0)||((b.dk?1:0)-(a.dk?1:0))||a.n-b.n);
 return out;
}
function renderTodo(){
 const el=document.getElementById("todo"); if(!el) return; const sc=el.scrollTop;
 const L=tdList(), left=L.filter(x=>!x.on).length;
 let h=`<header><h2>To-do</h2><div class="upd"><b>${L.length?(left?left+" left":"all done"):""}</b></div></header>`;
 if(L.length) h+='<div class="tdl">'+L.map(x=>`<label class="td${x.on?" on":""}"><input type="checkbox" data-id="${x.id}" data-item="${esc(x.text)}" data-date="${x.date}"${x.on?" checked":""}><span class="cb"></span><span class="tx">${esc(x.text)}${x.over?`<small class="od">overdue \u00b7 ${esc(x.over)}</small>`:""}${x.detail?`<small>${esc(x.detail.length>80?x.detail.slice(0,78)+"\u2026":x.detail)}</small>`:""}</span></label>`).join("")+'</div>';
 el.innerHTML=h; el.scrollTop=sc;
}
async function tdPush(item,date,v){ try{ if(typeof SNAP==="undefined"||!SNAP||!SNAP.live) return; await fetch(SNAP.live.url+"?k="+encodeURIComponent(SNAP.live.k)+"&a=todo&item="+encodeURIComponent(item)+"&date="+encodeURIComponent(date)+"&done="+(v?1:0),{cache:"no-store"}); if(typeof pullLive==="function") pullLive(); }catch(e){} }
document.getElementById("todo").addEventListener("change",e=>{const c=e.target; if(!c||!c.matches||!c.matches("input[data-id]")) return; const o=tdLoad(); o[c.dataset.id]={v:c.checked?1:0,d:tdToday()}; tdSave(o); renderTodo(); tdPush(c.dataset.item,c.dataset.date,c.checked);});

function render(){

 T["Calendar"].items.forEach(i=>{const p=pdate(i.date,i.time); if(p) ev.push({p,i,k:CAT[i.cat]||CAT.Other});});
 const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 let h="";
 for(let n=0;n<7;n++){
  const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+n);

  h+=`<div class="day ${n===0?"today":""}"><h3>${d.toLocaleDateString("en-GB",{weekday:"short"})}<b>${d.getDate()}</b>${d.toLocaleDateString("en-GB",{month:"short"})}</h3>${lines||'<div class="more">&mdash;</div>'}${es.length>4?`<div class="more">+${es.length-4} more</div>`:""}</div>`;
 }
 document.getElementById("strip").innerHTML=h;
 
 const end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+7);
 const later=ev.filter(e=>e.p.d>=end&&e.i.cat!=="Photography"||(e.p.d>=end&&/wedding/i.test(e.i.item))).sort((a,b)=>a.p.d-b.p.d).slice(0,5);
 document.getElementById("later").innerHTML="<span>COMING UP:</span>"+later.map(e=>`<span style="--k:${e.k}"><b>${fmtD(e.p.d)}</b> <em>${esc(e.i.item)}</em></span>`).join("");
 let gh="";
 BLOCKS.forEach(b=>{
  const t=T[b.tab]; if(!t) return;
  const hero=b.hero?b.hero(t):null;
  const hrs=ago(t.meta.updated); const stale=hrs!==null&&hrs>36;
  gh+=`<section class="blk${b.notitle?" quiet":""}">`;
  if(!b.notitle) gh+=`<header><h2>${esc(b.title)}</h2><div class="upd ${stale?"stale":""}">${stale?"STALE \u00b7 ":""}updated<br>${esc(t.meta.updated||"?")}</div></header>`;
  if(b.rows){
   const rs=b.rows(t);
   rs.forEach(r=>{ gh+= r.big?`<div class="bigrow"><div class="hero">${esc(r.big)}</div><div class="herosub">${esc(r.d)}</div></div>`:`<div class="row"><span class="t">${esc(r.t)}</span><div class="d">${esc(r.d)}</div></div>`;});
   if(!rs.length) gh+=`<div class="row"><span class="t" style="color:var(--dim)">Nothing scheduled</span></div>`;
  } else {
   let items=(b.pre?b.pre(t):t.items).filter(i=>!isPH(i)&&!(b.skip&&b.skip(i)));
   if(b.extra){const ex=b.extra(t).filter(i=>!isPH(i)); items=ex.concat(items.filter(i=>!ex.includes(i)));}
   items=items.filter(i=>{const p=pd(i.date); return !p||p.d>=start;});
   const phn=t.items.filter(isPH).length;
   items=items.map((x,k)=>[x,k]).sort((a,c)=>((cls(c[0])==='bad')-(cls(a[0])==='bad'))||a[1]-c[1]).map(x=>x[0]);
   if(hero) gh+=`<div class="hero">${esc(hero.big)}</div><div class="herosub">${esc(hero.sub)}</div>`;
   if(b.postFirst) gh+=b.post(t);
   (b.noitems?[]:items.slice(0,15)).forEach(i=>{const p=pd(i.date); const ds=p?fmtD(p.d)+(p.t?" "+hm(p.d):""):"";
    let det=i.detail; if(det.length>90) det=det.slice(0,88)+"\u2026";
    gh+=`<div class="row ${cls(i)}"><div><span class="t">${esc(i.item)}</span><span class="s">${esc(i.status)}</span></div><div class="d">${ds?esc(ds)+" \u00b7 ":""}${esc(det)}</div></div>`;});
   if(b.post&&!b.postFirst) gh+=b.post(t);
   if(!items.length&&!b.post) gh+=`<div class="row"><span class="t" style="color:var(--dim)">No updates yet</span></div>`;
   if(phn&&!b.post) gh+=`<div class="ph">${phn} item${phn>1?"s":""} not yet updated</div>`;
  }
  gh+="</section>";
 });
 document.getElementById("grid").innerHTML=gh; renderTodo();
 document.getElementById("foot").textContent=(footTxt())+" \u00b7 private page, to-do ticks sync to the sheet";

function showApp(){document.getElementById("gate").style.display="none";document.getElementById("app").style.visibility="visible";document.getElementById("app").style.display="flex";}
function showGate(msg){RAW=null;SNAP=null;LIVEAT=null;clearInterval(liveT);clearTimeout(idleT);["strip","legend","later","grid","todo","foot"].forEach(i=>document.getElementById(i).innerHTML="");document.getElementById("app").style.display="none";document.getElementById("app").style.visibility="hidden";document.getElementById("gate").style.display="flex";document.getElementById("pw").value="";document.getElementById("err").textContent=msg||"";}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error("This browser cannot decrypt here (needs https or a local file).");
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BLOB.salt),iterations:BLOB.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(BLOB.iv)},key,b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function bump(){ if(!RAW) return; clearTimeout(idleT); idleT=setTimeout(()=>showGate("Locked after 2 hours without use."),IDLE_MS); }
["pointerdown","keydown","touchstart","wheel"].forEach(e=>document.addEventListener(e,bump,{passive:true}));
document.getElementById("f").onsubmit=async ev=>{
  ev.preventDefault(); const pw=document.getElementById("pw").value; if(!pw) return;
  const btn=document.getElementById("signin"), er=document.getElementById("err"); btn.disabled=true; er.textContent="Checking\u2026";
  try{ SNAP=await unlock(pw.trim()); RAW=SNAP.tabs; document.getElementById("pw").value=""; er.textContent=""; showApp(); render(); bump(); startLive(); }
  catch(e){ er.textContent=(e&&e.name==="OperationError")?"Wrong code - try again.":(e.message||"Could not unlock."); }
  btn.disabled=false;
};
document.getElementById("pad").addEventListener("click",e=>{const k=e.target.closest("button")&&e.target.closest("button").dataset.k; if(k===undefined) return; const p=document.getElementById("pw"); if(k==="del") p.value=p.value.slice(0,-1); else if(k!=="") p.value+=k;});
document.addEventListener("keydown",e=>{ if(document.getElementById("gate").style.display==="none") return; const p=document.getElementById("pw"); if(/^\d$/.test(e.key)) p.value+=e.key; else if(e.key==="Backspace") p.value=p.value.slice(0,-1); });
let LIVEAT=null, liveT=null;
function footTxt(){ return LIVEAT ? "Live from Google Sheet \u00b7 last read "+LIVEAT.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" \u00b7 refreshes every 5 min" : "Snapshot "+"updated "+(SNAP&&SNAP.generated); }
async function pullLive(){ if(!SNAP||!SNAP.live||!RAW) return; try{ const r=await fetch(SNAP.live.url+"?k="+encodeURIComponent(SNAP.live.k),{cache:"no-store"}); const j=await r.json(); if(j&&j.ok&&j.tabs){ RAW=Object.assign({},SNAP.tabs,j.tabs); LIVEAT=new Date(); render(); } }catch(e){} }

<script>
(function(){
 var b=document.getElementById("fs"), de=document.documentElement;
 var can=de.requestFullscreen||de.webkitRequestFullscreen;
 if(!can) return;
 b.style.display="inline-block";
 function isFs(){return document.fullscreenElement||document.webkitFullscreenElement;}
 function upd(){b.textContent=isFs()?"Exit full screen":"Full screen";}
 b.onclick=function(){
  if(isFs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  else { (de.requestFullscreen||de.webkitRequestFullscreen).call(de); }
 };
 document.addEventListener("fullscreenchange",upd);
 document.addEventListener("webkitfullscreenchange",upd);
})();
